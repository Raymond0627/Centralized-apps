name: Sync Releases & Deploy Portal

on:
  push:
    branches:
      - main
  schedule:
    # Safety net: sync every 6 hours in case the instant trigger is missed
    - cron: '0 */6 * * *'
  workflow_dispatch:
  # Instant path: QScan / Pcount repos ping this on release publish.
  # Installed via .github/workflows/on-release.yml in those repos.  repository_dispatch:
    types: [app-release-published]

permissions:
  contents: write

jobs:
  sync-and-build:
    name: Sync Releases & Build Static Portal
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Portal Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch Latest Releases from GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/fetch_releases.py

      - name: Commit & Push Updated Release Metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/apps.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto-sync latest releases [skip ci]" && git push)

      # Pushing data/apps.json above triggers a fresh deploy of the static site:
      #   - Cloudflare Pages (if connected) redeploys automatically, or
      #   - Vercel (Git integration) rebuilds on every push to main.
      # The site fetches data/apps.json with cache:'no-store', so the new
      # version, file size, download URL and changelog appear on the next load.
