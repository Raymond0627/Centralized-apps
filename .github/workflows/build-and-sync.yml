name: Sync Releases & Deploy Portal

on:
  push:
    branches:
      - main
  schedule:
    # Optional safety net: sync every 6 hours automatically
    - cron: '0 */6 * * *'
  workflow_dispatch:
  # Allows Qcheck / Pcount repos to trigger rebuild on new release
  repository_dispatch:
    types: [app-release-published]

permissions:
  contents: write

jobs:
  sync-and-build:
    name: Sync Releases & Build Static Portal
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Portal Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch Latest Releases from GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/fetch_releases.py

      - name: Commit & Push Updated Release Metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/apps.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto-sync latest releases [skip ci]" && git push)

      # If you connect Cloudflare Pages to your GitHub repository (recommended, 0-config):
      # Cloudflare Pages will automatically detect the commit and re-deploy in ~30 seconds!
