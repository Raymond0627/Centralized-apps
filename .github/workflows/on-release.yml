# ==============================================================================
# LUMEED PORTAL — INSTANT RELEASE NOTIFICATION
#
# INSTALL BY COPYING THIS FILE TO BOTH REPOS:
#   Raymond0627/Automated-System/.github/workflows/on-release.yml   (QScan)
#   Raymond0627/Page-Counter/.github/workflows/on-release.yml       (Pcount)
#
# REQUIRES a secret named PORTAL_TRIGGER_TOKEN in the repo you copy this into:
#   1. Create a fine-grained or classic PAT with `repo` scope:
#        https://github.com/settings/tokens
#   2. In the target repo go to: Settings -> Secrets and variables -> Actions
#   3. Click "New repository secret", name it PORTAL_TRIGGER_TOKEN, paste the PAT
#
# WHY: the portal syncs release metadata every 6 hours by cron. This workflow
# sends a repository_dispatch so the portal syncs and redeploys within ~1 minute.
#
# NOTE: publish the release only AFTER the .exe finishes uploading, otherwise the
# sync can run before the installer is attached.
# ==============================================================================

name: Notify Central Portal on Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  notify-portal:
    name: Ping Lumeed Central Portal
    runs-on: ubuntu-latest
    steps:
      - name: Trigger portal release sync
        env:
          PORTAL_TOKEN: ${{ secrets.PORTAL_TRIGGER_TOKEN }}
          PORTAL_REPO: Raymond0627/Centralized-apps
        run: |
          set -euo pipefail

          if [ -z "${PORTAL_TOKEN}" ]; then
            echo "::error::PORTAL_TRIGGER_TOKEN secret is not set on this repository."
            exit 1
          fi

          status=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${PORTAL_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${PORTAL_REPO}/dispatches" \
            -d '{"event_type":"app-release-published"}')

          if [ "${status}" = "204" ]; then
            echo "✓ Portal notified — ${GITHUB_REPOSITORY} released ${{ github.event.release.tag_name }}."
          else
            echo "::error::Portal dispatch failed (HTTP ${status}):"
            cat /tmp/dispatch.out
            exit 1
          fi
