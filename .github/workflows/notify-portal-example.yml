# ==============================================================================
# COPY THIS WORKFLOW TO:
#   Raymond0627/Qcheck/.github/workflows/on-release.yml
#   Raymond0627/Pcount/.github/workflows/on-release.yml
# ==============================================================================
# Whenever you publish a new release in Qcheck or Pcount, this workflow pings
# your Central Portal repo to immediately fetch the new .exe and rebuild!
# ==============================================================================

name: Notify Central Portal on Release

on:
  release:
    types: [published]

jobs:
  notify-portal:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Portal Rebuild Dispatch
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.PORTAL_TRIGGER_TOKEN }}" \
            https://api.github.com/repos/Raymond0627/portal/dispatches \
            -d '{"event_type": "app-release-published"}'
